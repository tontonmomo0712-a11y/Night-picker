<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>NOCTRAIL 更新確認 v20.0</title>
<style>body{background:#0b1120;color:#edf4ff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;padding:32px 18px;line-height:1.75}.card{max-width:540px;margin:8vh auto;background:#142139;border:1px solid #456184;padding:24px;border-radius:22px}b{font-size:34px;color:#b9d6ff}a{color:#abcfff}small{color:#a9b8ca}</style></head>
<body><div class="card"><h1>NOCTRAIL 公開バージョン</h1><b id="version">v20.0</b><p>このページが表示されれば、GitHubの最新版に含まれる更新確認ページを公開ホスティングが配信しています。</p><p><a href="/">NOCTRAILを開く →</a></p><small>GitHubの最新コミットからバージョンを自動取得します</small></div><script>(function(){const el=document.getElementById('version');fetch('https://api.github.com/repos/tontonmomo0712-a11y/Night-picker/commits/main',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('failed');return r.json()}).then(d=>{const date=d.commit?.committer?.date||d.commit?.author?.date,sha=String(d.sha||'').slice(0,7);if(!date||!sha)return;const day=new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(date)).replaceAll('/','.');el.textContent='v'+day+'.'+sha}).catch(()=>{el.title='最新バージョンを取得できませんでした'})})();</script></body></html>
